<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>兔力计划 - 钉钉内部积分应用</title>
    <style>
        :root {
            --primary: #2A57D9;
            --primary-light: #E8EEFB;
            --primary-aux: #C5D3F2;
            --primary-hover: #7A9BE8;
            --bg-white: #FFFFFF;
            --bg-gray: #F5F7FA;
            --border: #E5E6EB;
            --text-main: #333F51;
            --text-secondary: #86909C;
            --success: #36B37E;
            --warning: #FFAB00;
            --error: #F53F3F;
            --radius-sm: 8px;
            --radius-md: 12px;
            --shadow-light: 0 2px 8px rgba(0,0,0,0.05);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        }

        body {
            background: var(--bg-gray);
            display: flex;
            justify-content: center;
            align-items: flex-start;
            padding: 0;
            margin: 0;
            min-height: 100vh;
        }

        .app {
            width: 100%;
            height: 100vh;
            background: var(--bg-white);
            overflow: hidden;
            position: relative;
        }

        .page {
            display: none;
            height: 100%;
            padding-bottom: 70px;
            overflow-y: auto;
        }

        .page.active {
            display: block;
        }

        .nav {
            position: absolute;
            bottom: 0;
            width: 100%;
            height: 60px;
            background: var(--bg-white);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .nav button {
            background: none;
            border: none;
            font-size: 12px;
            color: var(--text-secondary);
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
            cursor: pointer;
        }

        .nav button.active {
            color: var(--primary);
        }

        .nav svg {
            width: 24px;
            height: 24px;
            fill: currentColor;
        }

        .header {
            padding: 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .section-title {
            padding: 0 24px;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 16px;
        }

        .card {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            padding: 18px;
            box-shadow: var(--shadow-light);
            margin-bottom: 16px;
        }

        .avatar {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            overflow: hidden;
        }

        .avatar img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .btn-primary {
            background: var(--primary);
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: var(--radius-md);
            font-size: 14px;
            cursor: pointer;
        }

        .btn-primary:hover {
            background: var(--primary-hover);
        }

        .tag-group {
            display: flex;
            gap: 12px;
            padding: 0 24px 20px;
            flex-wrap: wrap;
        }

        .tag {
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 14px;
            background: var(--bg-gray);
            color: var(--text-secondary);
            border: none;
            cursor: pointer;
        }

        .tag.active {
            background: var(--primary);
            color: white;
        }

        .grid-2 {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            padding: 0 24px 24px;
        }

        .product-card {
            background: var(--bg-white);
            border-radius: var(--radius-md);
            box-shadow: var(--shadow-light);
            overflow: hidden;
            text-align: center;
        }

        .product-img {
            width: 100%;
            height: 160px;
            background: var(--bg-gray);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-img img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .product-info {
            padding: 14px;
        }

        .product-name {
            font-size: 14px;
            color: var(--text-main);
            margin-bottom: 6px;
        }

        .product-points {
            font-size: 14px;
            color: var(--primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
<div class="app">

    <!-- 首页 -->
    <div class="page active" id="page1">
        <div class="header">
            <div style="display:flex; align-items:center; gap:16px;">
                <div class="avatar">
                    <img src="./images/avatar.jpg" alt="用户头像">
                </div>
                <div>
                    <div style="font-size:18px; font-weight:600; color:var(--text-main);">张明</div>
                    <div style="font-size:14px; color:var(--text-secondary);">研发部·高级工程师</div>
                </div>
            </div>
            <div style="font-size:24px;">🔔</div>
        </div>

        <div style="padding:0 24px; margin-bottom:24px;">
            <div style="background: var(--primary-light); border-radius:var(--radius-md); padding:24px; text-align:center;">
                <div style="font-size:14px; color:var(--text-secondary); margin-bottom:12px;">当前兔力值</div>
                <div style="font-size:32px; font-weight:700; color:var(--primary); margin-bottom:16px;">1,250</div>
                <button class="btn-primary">今日签到</button>
            </div>
        </div>

        <div class="section-title">今日任务</div>
        <div style="display:flex; gap:16px; padding:0 24px 20px;">
            <div class="card" style="flex:1;">
                <div style="display:flex; align-items:center; gap:10px; margin-bottom:12px;">
                    <input type="checkbox" id="task1" style="width:18px; height:18px;">
                    <label for="task1" style="font-size:14px; color:var(--text-main);">完成代码审查 #421</label>
                </div>
                <div style="display:flex; align-items:center; gap:10px;">
                    <input type="checkbox" id="task2" style="width:18px; height:18px;">
                    <label for="task2" style="font-size:14px; color:var(--text-main);">提交周报总结</label>
                </div>
            </div>
            <div class="card" style="flex:1; text-align:center;">
                <div style="font-size:14px; color:var(--text-secondary); margin-bottom:12px;">图鉴收集</div>
                <div style="width:100px; height:100px; border-radius:50%; border:3px solid var(--border); border-top-color:var(--primary); display:flex; align-items:center; justify-content:center; margin:0 auto;">
                    <div style="font-size:20px; font-weight:600; color:var(--primary);">65%</div>
                </div>
                <div style="font-size:12px; color:var(--text-secondary); margin-top:8px;">已收集 13/20</div>
            </div>
        </div>

        <div class="section-title">热门兑换 <span style="float:right; color:var(--primary); font-size:14px;">查看全部</span></div>
        <div style="display:flex; gap:16px; padding:0 24px;">
            <div class="card" style="flex:1; text-align:center;">
                <div style="width:80px; height:80px; background:var(--bg-gray); border-radius:var(--radius-sm); margin:0 auto 12px; overflow:hidden;">
                    <img src="./images/cup.jpg" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-size:14px; color:var(--text-main);">品牌定制随行杯</div>
                <div style="font-size:14px; color:var(--primary); margin-top:8px;">ⓢ 500</div>
            </div>
            <div class="card" style="flex:1; text-align:center;">
                <div style="width:80px; height:80px; background:var(--bg-gray); border-radius:var(--radius-sm); margin:0 auto 12px; overflow:hidden;">
                    <img src="./images/Keychain.jpg" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-size:14px; color:var(--text-main);">IP钥匙链</div>
                <div style="font-size:14px; color:var(--primary); margin-top:8px;">ⓢ 300</div>
            </div>
            <div class="card" style="flex:1; text-align:center;">
                <div style="width:80px; height:80px; background:var(--bg-gray); border-radius:var(--radius-sm); margin:0 auto 12px; overflow:hidden;">
                    <img src="./images/cup2.jpg" style="width:100%; height:100%; object-fit:cover;">
                </div>
                <div style="font-size:14px; color:var(--text-main);">限定款随行杯</div>
                <div style="font-size:14px; color:var(--primary); margin-top:8px;">ⓢ 800</div>
            </div>
        </div>
    </div>

    <!-- 其他页面（商城/任务/广场/我的）结构和之前一样，我这里省略，你可以直接复制之前的 -->

    <!-- 底部导航 -->
    <div class="nav">
        <button onclick="go(1)" class="active">
            <svg viewBox="0 0 24 24"><path d="M10 20v-6h4v6h5v-8h3L12 3 2 12h3v8z"/></svg>
            首页
        </button>
        <button onclick="go(3)">
            <svg viewBox="0 0 24 24"><path d="M7 18c-1.1 0-1.99.9-1.99 2S5.9 22 7 22s2-.9 2-2-.9-2-2-2zM1 2v2h2l3.6 7.59-1.35 2.45c-.16.28-.25.61-.25.96 0 1.1.9 2 2 2h12v-2H7.42c-.14 0-.25-.11-.25-.25l.03-.12.9-1.63h7.45c.75 0 1.41-.41 1.75-1.03l3.58-6.49c.08-.14.12-.31.12-.48 0-.55-.45-1-1-1H5.21l-.94-2H1zm16 16c-1.1 0-1.99.9-1.99 2s.89 2 1.99 2 2-.9 2-2-.9-2-2-2z"/></svg>
            商城
        </button>
        <button onclick="go(2)">
            <svg viewBox="0 0 24 24"><path d="M19 3h-4.18C14.4 1.84 13.3 1 12 1s-2.4.84-2.82 2H5c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h14c1.1 0 2-.9 2-2V5c0-1.1-.9-2-2-2zm-7 0c.55 0 1 .45 1 1s-.45 1-1 1-1-.45-1-1 .45-1 1-1zM9.29 16.29L6.7 13.7a.996.996 0 111.41-1.41L10 14.17l5.88-5.88a.996.996 0 111.41 1.41l-6.59 6.59a.996.996 0 01-1.41 0z"/></svg>
            任务
        </button>
        <button onclick="go(5)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            广场
        </button>
        <button onclick="go(7)">
            <svg viewBox="0 0 24 24"><path d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/></svg>
            我的
        </button>
    </div>

</div>

<script>
    function go(num) {
        document.querySelectorAll('.page').forEach(p => p.classList.remove('active'))
        document.querySelectorAll('.nav button').forEach(b => b.classList.remove('active'))
        document.getElementById('page' + num).classList.add('active')
        event.currentTarget.classList.add('active')
    }
</script>
</body>
</html>
